<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Translate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      user-select: none;
      background: transparent;
      overflow: hidden;
    }
    .drag-region { -webkit-app-region: drag; }
    .no-drag { -webkit-app-region: no-drag; }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-1.5">

  <div class="w-full h-full bg-[#111827]/95 backdrop-blur-2xl border border-slate-700/60 rounded-2xl p-4 shadow-2xl flex flex-col justify-between overflow-hidden">
    
    <!-- Üst Bar -->
    <header class="drag-region flex items-center justify-between pb-3 border-b border-slate-800 cursor-move">
      <div class="flex items-center space-x-2">
        <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center shadow-md shadow-indigo-600/30">
          <i data-lucide="languages" class="w-4 h-4 text-white"></i>
        </div>
        <span class="text-sm font-semibold tracking-wide text-slate-200">Lumina Quick Translate</span>
      </div>

      <!-- Tonlama Seçenekleri -->
      <div class="no-drag flex items-center bg-slate-900 border border-slate-800 rounded-lg p-0.5 text-[11px]">
        <button data-tone="standard" class="tone-btn px-2.5 py-1 rounded-md bg-indigo-600 text-white font-medium transition">Doğal</button>
        <button data-tone="formal" class="tone-btn px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 transition">Resmi</button>
        <button data-tone="casual" class="tone-btn px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 transition">Samimi</button>
      </div>

      <!-- Dil Seçimleri -->
      <div class="no-drag flex items-center gap-1.5">
        <select id="sourceLang" class="bg-slate-900 border border-slate-700 text-xs font-medium rounded-lg px-2.5 py-1.5 focus:ring-1 focus:ring-indigo-500 outline-none text-slate-300">
          <option value="auto">Otomatik</option>
          <option value="en" selected>İngilizce</option>
          <option value="de">Almanca</option>
          <option value="fr">Fransızca</option>
          <option value="es">İspanyolca</option>
          <option value="ru">Rusça</option>
          <option value="tr">Türkçe</option>
        </select>

        <button id="swapBtn" class="p-1 text-slate-400 hover:text-white transition">
          <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
        </button>

        <select id="targetLang" class="bg-slate-900 border border-slate-700 text-xs font-medium rounded-lg px-2.5 py-1.5 focus:ring-1 focus:ring-indigo-500 outline-none text-slate-300">
          <option value="tr" selected>Türkçe</option>
          <option value="en">İngilizce</option>
          <option value="de">Almanca</option>
          <option value="fr">Fransızca</option>
          <option value="es">İspanyolca</option>
          <option value="ru">Rusça</option>
        </select>
      </div>
    </header>

    <!-- Metin Alanları -->
    <div class="grid grid-cols-2 gap-3 my-3 flex-1 min-h-0">
      <div class="flex flex-col bg-slate-900/80 border border-slate-800 rounded-xl p-3 relative h-full">
        <textarea id="sourceText" placeholder="Metin girin veya 'Alan Seç & Çevir' butonuna basın..." class="w-full h-full bg-transparent resize-none outline-none text-slate-200 placeholder-slate-500 text-sm leading-relaxed"></textarea>
      </div>

      <div class="flex flex-col bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 relative h-full">
        <div id="targetText" class="w-full h-full overflow-y-auto text-slate-200 text-sm leading-relaxed whitespace-pre-wrap select-text">
          <span class="text-slate-600 italic">Sonuç bekleniyor...</span>
        </div>
      </div>
    </div>

    <!-- Alt Bar -->
    <footer class="flex items-center justify-between text-[11px] text-slate-500 pt-2 border-t border-slate-800/80">
      <div class="flex gap-3 items-center">
        <span>Kopyala & Kapat: <kbd class="bg-slate-800 px-1 py-0.5 rounded text-indigo-400 font-semibold">Ctrl+Enter</kbd></span>
        <span>Aç: <kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-300">Ctrl+Alt+T</kbd></span>
        <span>Kapat: <kbd class="bg-slate-800 px-1 py-0.5 rounded text-slate-400">Esc</kbd></span>
      </div>

      <div class="flex items-center gap-2">
        <button id="snipBtn" class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition font-medium text-xs shadow-lg shadow-indigo-600/30">
          <i data-lucide="crop" class="w-3.5 h-3.5"></i>
          <span>Alan Seç & Çevir</span>
        </button>

        <button id="copyBtn" class="flex items-center gap-1 hover:text-slate-300 transition px-2 py-1">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> Kopyala
        </button>
      </div>
    </footer>

  </div>

  <script>
    const { ipcRenderer } = require('electron');
    lucide.createIcons();

    const sourceText = document.getElementById('sourceText');
    const targetText = document.getElementById('targetText');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');
    const copyBtn = document.getElementById('copyBtn');
    const swapBtn = document.getElementById('swapBtn');
    const snipBtn = document.getElementById('snipBtn');

    let currentTone = 'standard';
    let debounceTimer;

    document.querySelectorAll('.tone-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tone-btn').forEach(b => {
          b.className = 'tone-btn px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 transition';
        });
        btn.className = 'tone-btn px-2.5 py-1 rounded-md bg-indigo-600 text-white font-medium transition';
        currentTone = btn.dataset.tone;
        executeTranslate();
      });
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ipcRenderer.send('hide-window');

      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        const content = targetText.textContent.trim();
        if (content && !content.includes('Sonuç bekleniyor') && !content.includes('Çevriliyor')) {
          ipcRenderer.send('copy-and-close', content);
        }
      }
    });

    async function executeTranslate() {
      const text = sourceText.value.trim();
      if (!text) {
        targetText.innerHTML = '<span class="text-slate-600 italic">Sonuç bekleniyor...</span>';
        return;
      }

      targetText.innerHTML = '<span class="text-slate-500 animate-pulse">Çevriliyor...</span>';

      try {
        const res = await fetch('/api/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            text, 
            sourceLang: sourceLang.value, 
            targetLang: targetLang.value,
            tone: currentTone
          })
        });
        const data = await res.json();
        targetText.textContent = data.translatedText || '';
      } catch (err) {
        targetText.textContent = 'Hata oluştu.';
      }
    }

    sourceText.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(executeTranslate, 300);
    });

    sourceLang.addEventListener('change', executeTranslate);
    targetLang.addEventListener('change', executeTranslate);

    copyBtn.addEventListener('click', () => {
      const content = targetText.textContent;
      if (content && !content.includes('Sonuç bekleniyor')) {
        navigator.clipboard.writeText(content);
      }
    });

    swapBtn.addEventListener('click', () => {
      if (sourceLang.value === 'auto') return;
      const temp = sourceLang.value;
      sourceLang.value = targetLang.value;
      targetLang.value = temp;
      executeTranslate();
    });

    snipBtn.addEventListener('click', () => {
      ipcRenderer.send('start-snipping');
    });

    ipcRenderer.on('set-and-translate', (event, text) => {
      sourceText.value = text;
      executeTranslate();
    });

    ipcRenderer.on('process-ocr', async (event, croppedDataUrl) => {
      snipBtn.classList.add('opacity-50', 'pointer-events-none');
      snipBtn.innerHTML = '<i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i><span>Taranıyor...</span>';
      lucide.createIcons();

      sourceText.value = 'Görsel taranıyor...';

      try {
        const result = await Tesseract.recognize(croppedDataUrl, 'eng+tur');
        const text = result.data.text.trim();

        if (text) {
          sourceText.value = text;
          executeTranslate();
        } else {
          sourceText.value = '';
          alert('Seçilen alanda yazı bulunamadı.');
        }
      } catch (e) {
        console.error(e);
        alert('Okuma hatası oluştu.');
      } finally {
        snipBtn.classList.remove('opacity-50', 'pointer-events-none');
        snipBtn.innerHTML = '<i data-lucide="crop" class="w-3.5 h-3.5"></i><span>Alan Seç & Çevir</span>';
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
